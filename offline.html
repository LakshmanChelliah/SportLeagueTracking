<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline · GD RA Volleyball</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #f4f4f5;
        font-family: "Arial Narrow", Arial, sans-serif;
      }
      main { max-width: 28rem; padding: 32px 24px; text-align: center; }
      h1 { margin: 0; font-size: 64px; line-height: 0.9; letter-spacing: 0.04em; font-weight: 700; }
      p { margin: 14px 0 0; color: #a1a1aa; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 999px;
        background: #e8572a;
        color: #1c0c06;
        font: 700 15px system-ui, sans-serif;
        padding: 10px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GD RA</h1>
      <p>You’re offline. The board opens again when this phone is back on a network.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
